<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reglamento Interno de Trabajo — Inversiones Agropecuarias LOM SAS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f5f5;min-height:100vh;display:flex;flex-direction:column}
header{background:#1a1a2e;color:#fff;padding:18px 24px;display:flex;align-items:center;gap:14px}
.logo-circle{width:44px;height:44px;background:#e8456e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;flex-shrink:0}
.header-text h1{font-size:17px;font-weight:700;line-height:1.2}
.header-text p{font-size:12px;opacity:0.65;margin-top:3px}
.desktop-viewer{flex:1;display:flex;flex-direction:column}
.desktop-viewer iframe{flex:1;width:100%;border:none;min-height:calc(100vh - 80px)}
.mobile-view{display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;padding:32px 24px;text-align:center;gap:20px}
.mobile-card{background:#fff;border-radius:16px;padding:28px 24px;box-shadow:0 4px 24px rgba(0,0,0,.08);max-width:360px;width:100%}
.mobile-card h2{font-size:18px;color:#1a1a2e;margin-bottom:8px}
.mobile-card p{font-size:14px;color:#666;margin-bottom:24px;line-height:1.5}
.btn-ver{display:block;background:#e8456e;color:#fff;text-decoration:none;padding:15px 24px;border-radius:10px;font-size:16px;font-weight:700;text-align:center;transition:background 0.2s}
.btn-ver:hover{background:#c83058}
.btn-dl{display:block;margin-top:10px;background:#f0f0f0;color:#333;text-decoration:none;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;text-align:center}
.doc-info{font-size:12px;color:#999;margin-top:16px}
@media(max-width:700px){
  .desktop-viewer{display:none}
  .mobile-view{display:flex}
}
</style>
</head>
<body>
<header>
  <div class="logo-circle">L</div>
  <div class="header-text">
    <h1>Reglamento Interno de Trabajo</h1>
    <p>Inversiones Agropecuarias LOM SAS — Lomarosa</p>
  </div>
</header>

<!-- DESKTOP: iframe directo -->
<div class="desktop-viewer">
  <iframe src="RIT.pdf" title="Reglamento Interno de Trabajo"></iframe>
</div>

<!-- MÓVIL: botón para abrir -->
<div class="mobile-view">
  <div class="mobile-card">
    <h2>📋 Reglamento Interno de Trabajo</h2>
    <p>Inversiones Agropecuarias LOM SAS<br>Documento oficial para consulta de todos los trabajadores.</p>
    <a href="RIT.pdf" target="_blank" class="btn-ver">📄 Ver documento</a>
    <a href="RIT.pdf" download="RIT_LOM.pdf" class="btn-dl">⬇ Descargar PDF</a>
    <div class="doc-info">Versión vigente • Actualizado 2026</div>
  </div>
</div>

</body>
</html>
